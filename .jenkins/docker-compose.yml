services:
    npm-lint-unittest:
        image: node:24.14.1-bookworm
        working_dir: /usr/src/app
        volumes:
            - ${WORKSPACE}:/usr/src/app
        environment:
            HOME: /usr/src/app
        command: >
            bash -c "npm install --legacy-peer-deps && npm run lint && npm run test:unit"
